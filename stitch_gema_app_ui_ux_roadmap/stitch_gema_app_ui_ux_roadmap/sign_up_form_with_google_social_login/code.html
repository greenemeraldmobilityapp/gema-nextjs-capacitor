<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high transition-colors active:scale-95 duration-200 ease-in-out">

<div class="font-display-lg text-display-lg font-black text-primary">GEMA</div>

</header>

<!-- Header Text -->
<div class="mb-2xl">
<h1 class="font-headline-md text-headline-md text-on-surface">Buat Akun</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Mulai pengalaman baru bersama kami.</p>
</div>
<!-- Form Elements -->
<form class="flex flex-col gap-lg flex-1">
<!-- Input Group: Nama Lengkap -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-sm" for="namaLengkap">Nama Lengkap</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant px-md py-md font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline-variant shadow-sm rounded-full" id="namaLengkap" placeholder="Masukkan nama Anda" type="text"/>
</div>
</div>
<!-- Input Group: Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-sm" for="email">Email</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant px-md py-md font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline-variant shadow-sm rounded-full" id="email" placeholder="contoh@email.com" type="email"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-sm" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant px-md py-md pr-2xl font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-outline-variant shadow-sm rounded-full" id="password" placeholder="Minimal 8 karakter" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-md top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
<!-- Spacer to push button to bottom if needed, though relying on generous margins here -->
<div class="mt-xl">
<!-- Primary Action Button -->
<button class="w-full py-md bg-primary text-on-primary font-title-sm text-title-sm rounded-full shadow-md hover:bg-on-primary-fixed-variant transition-all active:scale-95 duration-150 transform flex items-center justify-center gap-sm" type="button">
                    Daftar

</div><!-- Divider -->
