<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pilih Pembayaran</title>
<!-- Google Fonts -->

                    "on-background": "#161d19",

<style>
        /* Custom styles to hide default radio buttons and create custom ones if needed, 
           but we will rely on Tailwind Forms plugin for simplicity and standard appearance */
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Hide scrollbar for clean aesthetic */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-sans antialiased">
<!-- Transactional Header (Custom adaptation of TopAppBar logic for sub-pages) -->
<header class="flex justify-between items-center w-full px-container-padding py-sm bg-surface shadow-sm sticky top-0 z-50">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-200 ease-in-out">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface flex-1 text-center pr-8">Pilih Pembayaran</h1>
<!-- Invisible spacer to balance the back button -->
<div class="w-8"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-container-padding py-lg pb-32">
<!-- Order Summary Snippet (Contextual grounding) -->
<div class="mb-lg">
<p class="font-label-md text-label-md text-outline mb-xs">Total Pembayaran</p>
<p class="font-display-lg text-display-lg text-primary">Rp 450.000</p>
</div>
<div class="space-y-sm">
<!-- Option 1: GemaPay (Selected State Example) -->
<label class="block relative group cursor-pointer">
<input checked="" class="peer sr-only" name="payment_method" type="radio" value="gemapay"/>
<!-- Card Surface -->
<div class="flex items-center p-md bg-surface-container-lowest rounded-DEFAULT shadow-sm border-2 border-transparent peer-checked:border-primary peer-checked:bg-surface transition-all duration-200">
<!-- Icon Area -->
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center shrink-0 mr-md group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<!-- Text Area -->
<div class="flex-1">
<h2 class="font-title-sm text-title-sm text-on-surface">GemaPay</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Saldo: Rp 1.250.000</p>
</div>
<!-- Radio Indicator (Custom) -->
<div class="w-6 h-6 rounded-full border-2 border-outline peer-checked:border-primary flex items-center justify-center ml-md">
<div class="w-3 h-3 rounded-full bg-primary scale-0 peer-checked:scale-100 transition-transform duration-200"></div>
</div>
</div>
</label>
<!-- Option 2: Credit/Debit Card -->
<label class="block relative group cursor-pointer">
<input class="peer sr-only" name="payment_method" type="radio" value="card"/>
<!-- Card Surface -->
<div class="flex items-center p-md bg-surface-container-lowest rounded-DEFAULT shadow-sm border-2 border-transparent peer-checked:border-primary peer-checked:bg-surface transition-all duration-200 hover:bg-surface-container-low">
<!-- Icon Area -->
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center shrink-0 mr-md group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">credit_card</span>
</div>
<!-- Text Area -->
<div class="flex-1">
<h2 class="font-title-sm text-title-sm text-on-surface">Kartu Kredit/Debit</h2>
<p class="font-body-md text-body-md text-outline mt-xs">Visa, Mastercard, JCB</p>
</div>
<!-- Radio Indicator (Custom) -->
<div class="w-6 h-6 rounded-full border-2 border-outline peer-checked:border-primary flex items-center justify-center ml-md">
<div class="w-3 h-3 rounded-full bg-primary scale-0 peer-checked:scale-100 transition-transform duration-200"></div>
</div>
</div>
</label>
<!-- Option 3: Bank Transfer -->
<label class="block relative group cursor-pointer">
<input class="peer sr-only" name="payment_method" type="radio" value="transfer"/>
<!-- Card Surface -->
<div class="flex items-center p-md bg-surface-container-lowest rounded-DEFAULT shadow-sm border-2 border-transparent peer-checked:border-primary peer-checked:bg-surface transition-all duration-200 hover:bg-surface-container-low">
<!-- Icon Area -->
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center shrink-0 mr-md group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">account_balance</span>
</div>
<!-- Text Area -->
<div class="flex-1">
<h2 class="font-title-sm text-title-sm text-on-surface">Transfer Bank</h2>
<p class="font-body-md text-body-md text-outline mt-xs">BCA, Mandiri, BNI, BRI</p>
</div>
<!-- Radio Indicator (Custom) -->
<div class="w-6 h-6 rounded-full border-2 border-outline peer-checked:border-primary flex items-center justify-center ml-md">
<div class="w-3 h-3 rounded-full bg-primary scale-0 peer-checked:scale-100 transition-transform duration-200"></div>
</div>
</div>
</label>
</div>
<!-- Add Voucher Section (Premium touch) -->
<div class="mt-lg">
<button class="w-full flex items-center justify-between p-md bg-surface-container rounded-DEFAULT hover:bg-surface-container-high transition-colors">
<div class="flex items-center">
<span class="material-symbols-outlined text-primary mr-sm" style="font-variation-settings: 'FILL' 1;">local_activity</span>
<span class="font-title-sm text-title-sm text-on-surface">Pakai Promo / Voucher</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-surface-container-lowest border-t border-surface-variant shadow-[0_-4px_16px_rgba(0,0,0,0.05)] z-40 pb-safe">
<button class="w-full py-md bg-primary text-on-primary font-title-sm text-title-sm rounded-full shadow-md hover:bg-on-primary-fixed-variant active:scale-95 transition-all duration-200 flex justify-center items-center">
            Konfirmasi Pembayaran
        </button>
</div>
</body></html>
