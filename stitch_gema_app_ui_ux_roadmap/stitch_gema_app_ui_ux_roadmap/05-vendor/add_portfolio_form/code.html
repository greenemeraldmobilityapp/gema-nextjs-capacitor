<body class="bg-surface text-on-surface font-body-md h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="docked full-width top-0 bg-surface shadow-sm z-50 flex justify-between items-center w-full px-container-padding py-sm">
<button aria-label="Kembali" class="text-on-surface-variant hover:bg-surface-container-high transition-colors p-2 rounded-full active:scale-95 duration-200 ease-in-out">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Tambah Portofolio</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-grow overflow-y-auto px-md py-lg flex flex-col gap-xl">
<!-- Image Upload Section -->
<section>
<div class="border-2 border-dashed border-outline-variant rounded-xl bg-surface-container-lowest h-48 flex flex-col items-center justify-center gap-sm cursor-pointer hover:border-primary-container transition-colors shadow-sm relative overflow-hidden group">
<span class="material-symbols-outlined text-4xl text-outline group-hover:text-primary-container transition-colors" data-icon="add_a_photo">add_a_photo</span>
<span class="font-label-md text-label-md text-outline group-hover:text-primary-container transition-colors">Unggah Foto Proyek</span>
<input accept="image/*" aria-label="Unggah Foto Proyek" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" type="file"/>
</div>
</section>
<!-- Form Fields Section -->
<section class="flex flex-col gap-lg bg-surface-container-lowest rounded-xl shadow-sm p-lg">
<!-- Judul Proyek -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="project-title">Judul Proyek</label>
<input class="bg-surface-container-low border-none rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary-container outline-none transition-shadow" id="project-title" placeholder="Contoh: Instalasi AC Kantor" type="text"/>
</div>
<!-- Kategori Layanan -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="service-category">Kategori Layanan</label>
<div class="relative">
<select class="w-full bg-surface-container-low border-none rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface appearance-none focus:ring-2 focus:ring-primary-container outline-none transition-shadow pr-10" id="service-category">
<option disabled="" selected="" value="">Pilih Kategori</option>
<option value="ac">Instalasi AC</option>
<option value="listrik">Perbaikan Listrik</option>
<option value="ledeng">Plumbing &amp; Ledeng</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Deskripsi Proyek -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="project-description">Deskripsi Proyek</label>
<textarea class="bg-surface-container-low border-none rounded-DEFAULT px-md py-sm font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary-container outline-none transition-shadow resize-none" id="project-description" placeholder="Ceritakan detail proyek yang telah diselesaikan..." rows="4"></textarea>
</div>
</section>
</main>
<!-- Bottom Action Area -->
<footer class="p-container-padding bg-surface-container-lowest shadow-[0_-4px_12px_rgba(0,0,0,0.05)] pb-safe relative z-40">
<button class="w-full bg-primary-container text-on-primary rounded-full py-md font-title-sm text-title-sm shadow-md active:scale-95 transition-transform duration-150 flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" data-icon="save">save</span>
            Tambah Portofolio
        </button>
</footer>
