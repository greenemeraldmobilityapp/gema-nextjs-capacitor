        body { -webkit-tap-highlight-color: transparent; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col pt-safe pb-safe">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-md h-16 bg-surface dark:bg-on-surface docked full-width top-0 sticky z-40">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors text-primary dark:text-primary-fixed-dim Active: scale-95 duration-150 ease-in-out">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary truncate flex-1 text-center px-4">Pusat Bantuan</h1>
<button aria-label="Information" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors text-primary dark:text-primary-fixed-dim Active: scale-95 duration-150 ease-in-out">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">info</span>
</button>
</header>
<main class="flex-1 pb-2xl md:pb-xl">
<!-- Search Hero Section -->
<section class="px-md pt-lg pb-xl bg-surface-container-low rounded-b-xl shadow-sm mb-lg relative overflow-hidden">
<div class="absolute top-0 right-0 -mr-16 -mt-16 w-48 h-48 bg-primary opacity-5 rounded-full blur-2xl pointer-events-none"></div>
<div class="absolute bottom-0 left-0 -ml-12 -mb-12 w-32 h-32 bg-secondary opacity-5 rounded-full blur-xl pointer-events-none"></div>
<div class="relative z-10 max-w-md mx-auto">
<h2 class="font-title-sm text-title-sm text-on-surface mb-sm text-center">Hai, ada yang bisa kami bantu?</h2>
<div class="relative mt-md">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant z-10">search</span>
<input class="w-full h-12 pl-12 pr-4 bg-surface-container-lowest rounded-DEFAULT border-none shadow-sm focus:ring-2 focus:ring-primary focus:outline-none font-body-md text-body-md text-on-surface placeholder-on-surface-variant transition-shadow" placeholder="Cari bantuan..." type="text"/>
</div>
</div>
</section>
<!-- Kategori Bantuan (Bento Grid) -->
<section class="px-md mb-xl max-w-lg mx-auto">
<h3 class="font-title-sm text-title-sm text-on-surface mb-md">Kategori Bantuan</h3>
<div class="grid grid-cols-2 gap-sm md:gap-gutter">
<!-- Card 1 -->
<button class="bg-surface-container-lowest p-md rounded-DEFAULT shadow-sm hover:shadow-md transition-shadow flex flex-col items-start gap-sm text-left border border-surface-container active:scale-95 duration-150">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
</div>
<span class="font-label-md text-label-md text-on-surface font-semibold mt-xs">Pesanan &amp; Pembayaran</span>
</button>
<!-- Card 2 -->
<button class="bg-surface-container-lowest p-md rounded-DEFAULT shadow-sm hover:shadow-md transition-shadow flex flex-col items-start gap-sm text-left border border-surface-container active:scale-95 duration-150">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<span class="font-label-md text-label-md text-on-surface font-semibold mt-xs">GemaPay</span>
</button>
<!-- Card 3 -->
<button class="bg-surface-container-lowest p-md rounded-DEFAULT shadow-sm hover:shadow-md transition-shadow flex flex-col items-start gap-sm text-left border border-surface-container active:scale-95 duration-150">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">shield_person</span>
</div>
<span class="font-label-md text-label-md text-on-surface font-semibold mt-xs">Akun &amp; Keamanan</span>
</button>
<!-- Card 4 -->
<button class="bg-surface-container-lowest p-md rounded-DEFAULT shadow-sm hover:shadow-md transition-shadow flex flex-col items-start gap-sm text-left border border-surface-container active:scale-95 duration-150">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">storefront</span>
</div>
<span class="font-label-md text-label-md text-on-surface font-semibold mt-xs">Layanan Vendor</span>
</button>
<!-- Card 5 (Full Width) -->
<button class="col-span-2 bg-surface-container-lowest p-md rounded-DEFAULT shadow-sm hover:shadow-md transition-shadow flex flex-row items-center justify-between text-left border border-surface-container active:scale-95 duration-150">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">policy</span>
</div>
<span class="font-label-md text-label-md text-on-surface font-semibold">Kebijakan Privasi</span>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</div>
</section>
<!-- Topik Populer -->
<section class="px-md max-w-lg mx-auto">
<h3 class="font-title-sm text-title-sm text-on-surface mb-md">Topik Populer</h3>
<div class="bg-surface-container-lowest rounded-DEFAULT shadow-sm border border-surface-container overflow-hidden divide-y divide-surface-container">
<!-- FAQ Item 1 -->
<button class="w-full flex items-start justify-between p-md hover:bg-surface-container-high transition-colors text-left group">
<div class="flex items-start gap-sm">
<span class="material-symbols-outlined text-primary mt-1" style="font-size: 20px;">help</span>
<div>
<p class="font-body-md text-body-md font-medium text-on-surface">Bagaimana cara membatalkan pesanan?</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- FAQ Item 2 -->
<button class="w-full flex items-start justify-between p-md hover:bg-surface-container-high transition-colors text-left group">
<div class="flex items-start gap-sm">
<span class="material-symbols-outlined text-primary mt-1" style="font-size: 20px;">help</span>
<div>
<p class="font-body-md text-body-md font-medium text-on-surface">Cara upgrade akun vendor</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- FAQ Item 3 -->
<button class="w-full flex items-start justify-between p-md hover:bg-surface-container-high transition-colors text-left group">
<div class="flex items-start gap-sm">
<span class="material-symbols-outlined text-primary mt-1" style="font-size: 20px;">help</span>
<div>
<p class="font-body-md text-body-md font-medium text-on-surface">Mengapa pembayaran GemaPay saya gagal?</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
</div>
<!-- View All Button -->
<div class="mt-md flex justify-center">
<button class="font-label-md text-label-md text-primary bg-primary/10 hover:bg-primary/20 px-lg py-sm rounded-full transition-colors flex items-center gap-xs">
                    Lihat Semua Topik
                    <span class="material-symbols-outlined" style="font-size: 16px;">arrow_forward</span>
</button>
</div>
</section>
</main>
<!-- Bottom Navigation Suppressed intentionally as per rules for Help Center / Support Sub-pages -->
