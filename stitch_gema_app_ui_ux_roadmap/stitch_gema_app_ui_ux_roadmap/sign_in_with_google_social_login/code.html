<body class="bg-surface-container-lowest min-h-screen flex flex-col justify-center items-center px-container-padding antialiased">
<main class="w-full max-w-sm flex flex-col items-center">
<!-- Logo Header -->
<div class="mb-2xl font-display-lg text-display-lg font-black text-primary tracking-tighter">
            GEMA
        </div>
<!-- Welcome Text -->
<div class="w-full mb-xl text-center">
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Selamat datang kembali</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Silakan masuk ke akun Anda untuk melanjutkan</p>
</div>
<!-- Login Form -->
<form action="#" class="w-full flex flex-col gap-lg" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface ml-1" for="email">Email</label>
<div class="relative">
<input class="w-full px-md py-3 border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-shadow shadow-sm rounded-full" id="email" placeholder="Masukkan alamat email" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface ml-1" for="password">Password</label>
<div class="relative">
<input class="w-full pl-md pr-12 py-3 border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-shadow shadow-sm rounded-full" id="password" placeholder="Masukkan password" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
<div class="w-full flex justify-end mt-xs">
<a class="font-label-md text-label-md text-primary hover:text-surface-tint transition-colors" href="#">Lupa password?</a>
</div>
</div>
<!-- Submit Action -->
<div class="mt-sm">
<button class="w-full flex items-center justify-center py-4 bg-primary-container text-on-primary font-title-sm text-title-sm rounded-full hover:bg-primary transition-all active:scale-95 shadow-md" type="submit">
                    Masuk
                </button>
</div><div class="flex items-center gap-md my-md">
<div class="flex-grow h-px bg-outline-variant"></div>
<span class="font-label-md text-label-md text-on-surface-variant whitespace-nowrap">atau masuk dengan</span>
<div class="flex-grow h-px bg-outline-variant"></div>
</div><button class="w-full flex items-center justify-center gap-sm py-3 border border-outline-variant bg-surface-container-lowest text-on-surface font-title-sm text-title-sm rounded-full hover:bg-surface-container-low transition-all active:scale-95 shadow-sm" type="button">

</button>
