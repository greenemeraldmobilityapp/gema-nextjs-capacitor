name: Build Android AAB (Release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

concurrency:
  group: capacitor-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-aab:
    name: Build Android AAB (Release)
    runs-on: ubuntu-latest
    environment: production

    outputs:
      version: ${{ steps.extract_version.outputs.version }}

    steps:
      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify build works
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/cli@latest @capacitor/android@latest

      - name: Create production environment file
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" > .env.production
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.production

      - name: Build Next.js static export
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > android/app/release.keystore
          echo "Keystore decoded"

      - name: Update app build.gradle with signing config
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename AAB with version
        run: |
          VERSION=${{ steps.extract_version.outputs.version }}
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_PATH" ]; then
            cp "$AAB_PATH" "GEMA-${VERSION}.aab"
            echo "AAB_NAME=GEMA-${VERSION}.aab" >> $GITHUB_ENV
            ls -la "GEMA-${VERSION}.aab"
          else
            echo "AAB not found at $AAB_PATH"
            find android -name "*.aab" 2>/dev/null
            exit 1
          fi

      - name: Upload AAB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gema-android-aab-${{ steps.extract_version.outputs.version }}
          path: GEMA-*.aab
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GEMA Release v${{ steps.extract_version.outputs.version }}
          body: |
            ## 📱 GEMA v${{ steps.extract_version.outputs.version }} Release Notes

            ### ✅ Build Artifacts
            - Android AAB: `GEMA-${{ steps.extract_version.outputs.version }}.aab`

            ### 🔒 Security Notes
            - Production build with ProGuard minification enabled
            - Code signing configured

            ### 📦 What's New
            See commit history for details.

            ---
            *Built with ❤️ using GitHub Actions*
          files: GEMA-*.aab
          draft: false

  notify-success:
    name: Notify on Success
    needs: build-android-aab
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Send success notification
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ GEMA Android AAB Build Success",
              "blocks": [
                {
                  "type": "header",
                  "text": {"type": "plain_text", "text": "✅ GEMA Android AAB Build Success"}
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Version:*\n${{ needs.build-android-aab.outputs.version }}"},
                    {"type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}"}
                  ]
                },
                {
                  "type": "section",
                  "text": {"type": "mrkdwn", "text": "<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}|View Release>"}
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-failure:
    name: Notify on Failure
    needs: build-android-aab
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Send failure notification
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "⚠️ GEMA Android AAB Build Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {"type": "plain_text", "text": "⚠️ GEMA Android AAB Build Failed"}
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}"},
                    {"type": "mrkdwn", "text": "*Workflow:*\n${{ github.workflow }}"}
                  ]
                },
                {
                  "type": "section",
                  "text": {"type": "mrkdwn", "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"}
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}